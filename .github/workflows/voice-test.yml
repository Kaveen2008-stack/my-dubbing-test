name: Voice Test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install edge-tts scipy transformers torch --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python test_voice.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-results
          path: output/
